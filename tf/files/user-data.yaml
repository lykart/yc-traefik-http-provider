#cloud-config
write_files:
  - path: /etc/traefik/config-dynamic.yaml
    encoding: base64
    content: ${CONFIG_DYNAMIC}
  - path: /etc/traefik/config-static.yaml
    encoding: base64
    content: ${CONFIG_STATIC}
  - content: |
      [SERVICE]
          Flush         1
          Log_File      /var/log/fluentbit.log
          Log_Level     error
          Daemon        off
          Parsers_File  /fluent-bit/etc/parsers.conf

      [FILTER]
          Name parser
          Match traefik.logs
          Key_Name log
          Parser docker
          Reserve_Data On
      [FILTER]
          Name nest
          Match traefik.logs
          Operation lift
          Nested_under log

      [INPUT]
          Name              forward
          Listen            0.0.0.0
          Port              24224
          Buffer_Chunk_Size 1M
          Buffer_Max_Size   6M

      [OUTPUT]
          Name            yc-logging
          Match           *
          group_id        ${YC_GROUP_ID}
          message_key     text
          level_key       level
          default_level   WARN
          authorization   instance-service-account
          resource_type   vm
          resource_id     {{instance/hostname}}
          stream_name     {container_name}
    path: /etc/fluentbit/fluentbit.conf
  - content: |
      [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S %z
        Decode_Field_as json log
    path: /etc/fluentbit/parsers.conf

users:
  - name: yc-user
    groups: sudo
    shell: /bin/bash
    sudo: [ 'ALL=(ALL) NOPASSWD:ALL' ]
    ssh-authorized-keys:
      - ${SSH_PUBLIC_KEY}
